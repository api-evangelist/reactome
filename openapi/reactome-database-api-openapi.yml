openapi: 3.2.0
info:
  title: Reactome Database API
  contact:
    name: Reactome
    url: https://reactome.org
    email: help@reactome.org
  termsOfService: /license
  version: '1.0'
  description: 'Operations tagged database across 2 of this provider''s published API definitions: analysis-service.json, content-service.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /AnalysisService
- url: /ContentService
tags:
- name: Database
  description: Database info queries
paths:
  /database/name:
    get:
      tags:
      - Database
      summary: The name of current database
      operationId: getDBName
      responses:
        '406':
          description: Not acceptable according to the accept headers sent in the request
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal Server Error
          content:
            text/plain:
              schema:
                type: string
    servers:
    - url: /AnalysisService
  /database/version:
    get:
      tags:
      - Database
      summary: The version number of current database
      operationId: getDBVersion
      responses:
        '406':
          description: Not acceptable according to the accept headers sent in the request
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal Server Error
          content:
            text/plain:
              schema:
                type: string
    servers:
    - url: /AnalysisService
  /data/database/name:
    get:
      tags:
      - Database
      summary: The name of current database
      operationId: getDBName
      parameters:
      - name: view
        in: query
        description: Global parameter - Customise the view to be more concise and/or aggregate relationships
        required: false
        schema:
          type: string
          default: flatten
          enum:
          - flatten
          - nested
          - nested-aggregated
          example: null
      - name: includeRef
        in: query
        description: Global parameter - If true, replace element ref to dbId by standard JSOG object {@ref}
        required: false
        schema:
          type: boolean
          default: false
          example: null
      responses:
        '406':
          description: Not acceptable according to the accept headers sent in the request
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal Server Error
          content:
            text/plain:
              schema:
                type: string
    servers:
    - url: /ContentService
  /data/database/version:
    get:
      tags:
      - Database
      summary: The version number of current database
      operationId: getDBVersion
      parameters:
      - name: view
        in: query
        description: Global parameter - Customise the view to be more concise and/or aggregate relationships
        required: false
        schema:
          type: string
          default: flatten
          enum:
          - flatten
          - nested
          - nested-aggregated
          example: null
      - name: includeRef
        in: query
        description: Global parameter - If true, replace element ref to dbId by standard JSOG object {@ref}
        required: false
        schema:
          type: boolean
          default: false
          example: null
      responses:
        '406':
          description: Not acceptable according to the accept headers sent in the request
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal Server Error
          content:
            text/plain:
              schema:
                type: string
    servers:
    - url: /ContentService
x-refined-from:
- analysis-service.json
- content-service.json
