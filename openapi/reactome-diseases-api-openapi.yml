openapi: 3.2.0
info:
  title: Content Service Diseases API
  description: REST API for Reactome content
  termsOfService: /license
  contact:
    name: Reactome
    url: https://reactome.org
    email: help@reactome.org
  license:
    name: Creative Commons Attribution 4.0 International (CC BY 4.0) License
    url: https://creativecommons.org/licenses/by/4.0/
  version: '1.2'
servers:
- url: /ContentService
tags:
- name: Diseases
  description: 'Reactome Data: Disease related queries'
paths:
  /data/diseases:
    get:
      tags:
      - Diseases
      summary: The list of disease objects
      description: It retrieves the list of diseases annotated in Reactome
      operationId: getDiseases
      parameters:
      - name: view
        in: query
        description: Global parameter - Customise the view to be more concise and/or aggregate relationships
        required: false
        schema:
          type: string
          default: flatten
          enum:
          - flatten
          - nested
          - nested-aggregated
          example: null
      - name: includeRef
        in: query
        description: Global parameter - If true, replace element ref to dbId by standard JSOG object {@ref}
        required: false
        schema:
          type: boolean
          default: false
          example: null
      responses:
        '406':
          description: Not acceptable according to the accept headers sent in the request
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /data/diseases/doid:
    get:
      tags:
      - Diseases
      summary: The list of diseases DOID
      description: It retrieves the list of disease DOIDs annotated in Reactome
      operationId: getDiseasesSummary
      parameters:
      - name: view
        in: query
        description: Global parameter - Customise the view to be more concise and/or aggregate relationships
        required: false
        schema:
          type: string
          default: flatten
          enum:
          - flatten
          - nested
          - nested-aggregated
          example: null
      - name: includeRef
        in: query
        description: Global parameter - If true, replace element ref to dbId by standard JSOG object {@ref}
        required: false
        schema:
          type: boolean
          default: false
          example: null
      responses:
        '406':
          description: Not acceptable according to the accept headers sent in the request
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal Server Error
          content:
            text/plain:
              schema:
                type: string
