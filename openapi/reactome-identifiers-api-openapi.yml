components:
  schemas:
    AnalysisResult:
      type: object
      properties:
        expression:
          $ref: '#/components/schemas/ExpressionSummary'
        identifiersNotFound:
          type: integer
          format: int32
        pathways:
          type: array
          items:
            $ref: '#/components/schemas/PathwaySummary'
        pathwaysFound:
          type: integer
          format: int32
        resourceSummary:
          type: array
          items:
            $ref: '#/components/schemas/ResourceSummary'
        speciesSummary:
          type: array
          items:
            $ref: '#/components/schemas/SpeciesSummary'
        summary:
          $ref: '#/components/schemas/AnalysisSummary'
        warnings:
          type: array
          items:
            type: string
    PathwaySummary:
      type: object
      properties:
        dbId:
          type: integer
          format: int64
        entities:
          $ref: '#/components/schemas/EntityStatistics'
        inDisease:
          type: boolean
        llp:
          type: boolean
        name:
          type: string
        reactions:
          $ref: '#/components/schemas/ReactionStatistics'
        species:
          $ref: '#/components/schemas/SpeciesSummary'
        stId:
          type: string
    AnalysisSummary:
      type: object
      properties:
        fileName:
          type: string
        gsaMethod:
          type: string
        gsaToken:
          type: string
        includeDisease:
          type: boolean
        interactors:
          type: boolean
        projection:
          type: boolean
        sampleName:
          type: string
        species:
          type: integer
          format: int64
        text:
          type: boolean
        token:
          type: string
        type:
          type: string
    ResourceSummary:
      type: object
      properties:
        filtered:
          type: integer
          format: int32
        pathways:
          type: integer
          format: int32
        resource:
          type: string
    SpeciesSummary:
      type: object
      properties:
        dbId:
          type: integer
          format: int64
        filtered:
          type: integer
          format: int32
        name:
          type: string
        pathways:
          type: integer
          format: int32
        taxId:
          type: string
    EntityStatistics:
      type: object
      properties:
        curatedFound:
          type: integer
          format: int32
        curatedTotal:
          type: integer
          format: int32
        exp:
          type: array
          items:
            type: number
            format: double
        fdr:
          type: number
          format: double
        found:
          type: integer
          format: int32
        getpValue:
          type: number
          format: double
        interactorsFound:
          type: integer
          format: int32
        interactorsTotal:
          type: integer
          format: int32
