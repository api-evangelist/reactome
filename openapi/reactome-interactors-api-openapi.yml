  /interactors/psicquic/molecules/{resource}/details:
    post:
      tags:
      - interactors
      summary: Retrieve clustered interaction, sorted by score, of a given accession(s) by resource.
      operationId: getProteinsDetailsByResource
      parameters:
      - name: resource
