      parameters:
      - name: token
        in: path
        description: The token associated with the data to query
        required: true
        schema:
          type: string
      - name: pathway
        in: path
        description: The identifier of the pathway of interest
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: page number
        required: false
        schema:
          type: integer
          format: int32
        example: 1
      - name: pageSize
        in: query
        description: identifiers per page
        required: false
        schema:
          type: integer
          format: int32
        example: 20
      - name: resource
        in: query
        required: false
        schema:
