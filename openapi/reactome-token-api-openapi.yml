openapi: 3.0.1
info:
  title: Pathway Analysis Service database token API
  description: Provides an API for pathway over-representation and expression analysis as well as species comparison tool.
  termsOfService: /license
  contact:
    name: Reactome
    url: https://reactome.org
    email: help@reactome.org
  license:
    name: Creative Commons Attribution 3.0 Unsupported License
    url: https://creativecommons.org/licenses/by/3.0/legalcode
  version: '2.0'
servers:
- url: /AnalysisService
tags:
- name: token
  description: Previous queries filter
paths:
  /token/{token}:
    get:
      tags:
      - token
      summary: Returns the result associated with the token
      description: Use page and pageSize to reduce the amount of data retrieved. Use sortBy and order to sort the result by your preferred option. The resource field will filter the results to show only those corresponding to the preferred molecule type (TOTAL includes all the different molecules type)
      operationId: getToken
      parameters:
      - name: token
        in: path
        description: The token associated with the data to query
        required: true
        schema:
          type: string
      - name: species
        in: query
        description: list of species to filter the result (accepts taxonomy ids, species names and dbId)
        required: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: pathways per page
        required: false
        schema:
          type: integer
          format: int32
        example: 20
      - name: page
        in: query
        description: page number
        required: false
        schema:
          type: integer
          format: int32
        example: 1
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
          description: how to sort the result
          example: ENTITIES_PVALUE
          enum:
          - NAME
          - TOTAL_ENTITIES
          - TOTAL_INTERACTORS
          - TOTAL_REACTIONS
          - FOUND_ENTITIES
          - FOUND_INTERACTORS
          - FOUND_REACTIONS
          - ENTITIES_RATIO
          - ENTITIES_PVALUE
          - ENTITIES_FDR
          - REACTIONS_RATIO
      - name: order
        in: query
        required: false
        schema:
          type: string
          description: specifies the order
          example: ASC
          enum:
          - ASC
          - DESC
      - name: resource
        in: query
        required: false
        schema:
          type: string
          description: the resource to sort
          example: TOTAL
          enum:
          - TOTAL
          - UNIPROT
          - ENSEMBL
          - CHEBI
          - IUPHAR
          - MIRBASE
          - NCBI_PROTEIN
          - EMBL
          - COMPOUND
          - PUBCHEM_COMPOUND
      - name: pValue
        in: query
        description: defines the pValue threshold. Only hit pathway with pValue equals or below the threshold will be returned
        required: false
        schema:
          type: number
          format: double
          default: 1.0
        example: 1
      - name: includeDisease
        in: query
        description: set to 'false' to exclude the disease pathways from the result (it does not alter the statistics)
        required: false
        schema:
          type: boolean
      - name: min
        in: query
        description: minimum number of contained entities per pathway (takes into account the resource)
        required: false
        schema:
          type: integer
          format: int32
      - name: max
        in: query
        description: maximum number of contained entities per pathway (takes into account the resource)
        required: false
        schema:
          type: integer
          format: int32
      - name: importableOnly
        in: query
        description: Filters resources to only includes importable ones
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '404':
          description: No result corresponding to the token was found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResult'
        '410':
          description: Result deleted due to a new data release
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResult'
  /token/{token}/filter/pathways:
    post:
      tags:
      - token
      summary: Returns the result for the pathway ids sent by post (when they are present in the original result)
      description: For a given list of pathway identifiers it will retrieve a list containing those that are present in the result (with the results for the indicated molecule type)
      operationId: getTokenFilterPathways
      parameters:
      - name: token
        in: path
        description: The token associated with the data to query
        required: true
        schema:
          type: string
      - name: resource
        in: query
        required: false
        schema:
          type: string
          description: the resource to sort
          example: TOTAL
          enum:
          - TOTAL
          - UNIPROT
          - ENSEMBL
          - CHEBI
          - IUPHAR
          - MIRBASE
          - NCBI_PROTEIN
          - EMBL
          - COMPOUND
          - PUBCHEM_COMPOUND
      - name: pValue
        in: query
        description: defines the pValue threshold. Only hit pathway with pValue equals or below the threshold will be returned
        required: false
        schema:
          type: number
          format: double
          default: 1.0
        example: 1
      - name: species
        in: query
        description: list of species to filter the result (accepts taxonomy ids, species names and dbId)
        required: false
        schema:
          type: string
      - name: includeDisease
        in: query
        description: set to 'false' to exclude the disease pathways from the result (it does not alter the statistics)
        required: false
        schema:
          type: boolean
      - name: min
        in: query
        description: minimum number of contained entities per pathway (takes into account the resource)
        required: false
        schema:
          type: integer
          format: int32
      - name: max
        in: query
        description: maximum number of contained entities per pathway (takes into account the resource)
        required: false
        schema:
          type: integer
          format: int32
      - name: importableOnly
        in: query
        description: Filters resources to only includes importable ones
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        description: '<b>input</b> A comma separated list with the identifiers of the pathways of interest (NOTE: is plain text, not json)'
        content:
          text/plain:
            schema:
              type: string
        required: true
      responses:
        '404':
          description: No result corresponding to the token was found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PathwaySummary'
        '410':
          description: Result deleted due to a new data release
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PathwaySummary'
  /token/{token}/filter/species/{species}:
    get:
      tags:
      - token
      summary: Filters the result by species
      operationId: filterBySpecies
      parameters:
      - name: token
        in: path
        description: The token associated with the data to query
        required: true
        schema:
          type: string
      - name: species
        in: path
        description: The species to filter the result (accepts the taxonomy id, species names and dbId)
        required: true
        schema:
          type: string
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
          description: how to sort the result
          example: ENTITIES_PVALUE
          enum:
          - NAME
          - TOTAL_ENTITIES
          - TOTAL_INTERACTORS
          - TOTAL_REACTIONS
          - FOUND_ENTITIES
          - FOUND_INTERACTORS
          - FOUND_REACTIONS
          - ENTITIES_RATIO
          - ENTITIES_PVALUE
          - ENTITIES_FDR
          - REACTIONS_RATIO
      - name: order
        in: query
        required: false
        schema:
          type: string
          description: specifies the order
          example: ASC
          enum:
          - ASC
          - DESC
      - name: resource
        in: query
        required: false
        schema:
          type: string
          description: the resource to sort
          example: TOTAL
          enum:
          - TOTAL
          - UNIPROT
          - ENSEMBL
          - CHEBI
          - IUPHAR
          - MIRBASE
          - NCBI_PROTEIN
          - EMBL
          - COMPOUND
          - PUBCHEM_COMPOUND
      - name: importableOnly
        in: query
        description: Filters resources to only includes importable ones
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '404':
          description: No result corresponding to the token was found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeciesFilteredResult'
        '410':
          description: Result deleted due to a new data release
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeciesFilteredResult'
  /token/{token}/found/all:
